name: lotm_reader
description: LOTM reader with online reading, background offline downloads, and account sync.
publish_to: none
version: 1.1.0+2
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: 4.14.1
  path_provider: 2.1.6
  crypto: 3.0.7
  url_launcher: 6.3.2
  flutter_foreground_task: ^11.0.3
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.5
flutter:
  uses-material-design: true
  fonts:
    - family: ReaderRoboto
      fonts:
        - asset: assets/brand/Roboto.ttf
        - asset: assets/brand/Roboto-Italic.ttf
          style: italic
  assets:
    - assets/reader/
    - assets/reader/assets/
    - assets/fonts/
    - assets/meta.json
    - assets/license.md
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: branding/seer.webp
  adaptive_icon_background: '#0C1319'
  adaptive_icon_foreground: branding/seer.webp
  adaptive_icon_foreground_inset: 20
